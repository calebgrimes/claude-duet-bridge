# Duet Bridge runner settings. Copy this file to config.toml (worker/setup.sh does it for you).
# config.toml is gitignored: it holds your folder paths.

url = ""                               # the Worker URL, no trailing slash. setup.sh fills it in. Empty = the runner does nothing.
token_file = "~/.duet-bridge-token"    # bearer token the Mac sends to the Worker. setup.sh makes it.
log_file = "~/Library/Logs/duet-bridge.log"
model = "opus"
timeout_secs = 1800                    # one read-mode job or turn may run this long
work_timeout_secs = 3600               # one work-mode turn may run this long
max_parallel = 2                       # how many sessions and jobs run at the same time
poll_secs = 3                          # how often serve asks the Worker for work when idle
max_jobs_per_run = 3                   # only for `duet-bridge.py poll`: jobs taken per check

# Read mode (the default). Tools a run may use. Everything else is refused (--permission-mode dontAsk).
# Add read-only MCP tools by full name ("mcp__calendar__list_events") or a whole server ("mcp__calendar").
allowed_tools = ["Read", "Glob", "Grep"]

# Read mode. Tools that are refused even when allowed_tools would allow them. If you leave this out,
# duet-bridge.py uses DEFAULT_DENIED: no shell, no edits, no web, no sub-agents, no scheduling,
# no messages to other sessions, and no reads of dotfiles. If you set it, you replace that list.
# denied_tools = [...]

# Work mode. A session started with mode "work" uses your normal Claude Code setup (your MCP servers,
# settings and hooks) with --permission-mode auto. List tools here that work mode must never use.
# work_denied_tools = ["WebFetch"]

# Names a Duet job or session may give, and the folder each one runs in.
# The names must match WORKSPACES in worker/wrangler.jsonc.
[workspaces]
default = "~/Documents"

# Read mode only. The ONLY MCP servers a read-mode run loads (--strict-mcp-config). Leave out anything that can send or write.
# A local server:
# [mcp_servers.calendar]
# command = "~/mcp/calendar/.venv/bin/python"
# args = ["~/mcp/calendar/server.py"]
# A remote server:
# [mcp_servers.docs]
# url = "https://example.com/mcp"

# Extra environment variables for each run, for example a flag your own hooks read
# to stay quiet in unattended runs.
[job_env]
# MY_HOOKS_HEADLESS = "1"
